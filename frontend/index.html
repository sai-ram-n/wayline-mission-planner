<!doctype html>
<!--
  The background colour is set on the document itself, not only in the stylesheet,
  so the first paint is dark instead of flashing white before the CSS and app load.
-->
<html lang="en" style="background:#101010">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wayline Mission Planner</title>
    <meta name="description" content="Plan drone flight missions on an interactive map." />
    <meta name="theme-color" content="#101010" />
    <meta name="color-scheme" content="dark" />
    <!--
      Favicon inlined as a data URI: a route line with a start point, matching the
      map styling. Inlined so it needs no extra request and works fully offline.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f14'/%3E%3Cpath d='M7 23 L13 11 L20 18 L26 8' fill='none' stroke='%233b9dff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='7' cy='23' r='3.2' fill='%232ecc71'/%3E%3C/svg%3E"
    />
  </head>
  <body style="background:#101010">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
